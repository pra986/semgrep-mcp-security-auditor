[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semgrep-mcp-security-auditor"
version = "0.1.0"
description = "Cybersecurity code auditor combining immutable Semgrep MCP static findings with LLM remediation advisory, secret redaction, and Azure/GCP container deployment."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[project.scripts]
security-auditor = "security_auditor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
